# The shortened Inferno, for now just TzKal-Zuk alone so the fight can be tested quickly. The real
# shortened list (six waves that show every monster once, a lone JalTok-Jad, the three Jads of wave
# 68, then Zuk) is kept below, commented out: put it back when testing is done. Any list of waves
# works, but the last wave must be TzKal-Zuk alone.

[[wave]]
number = 1
monsters = ["zuk"]
boss = true

